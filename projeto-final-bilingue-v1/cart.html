<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title data-i18n="title_cart"></title>
  <link rel="stylesheet" href="css/cart.css">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <header>
    <nav>
      <h1>
        <a href="index.html">Boo!Bazar</a>
      </h1>

      <ol class="nav-links">
        <li><a href="cart.html" data-i18n="menu_cart"></a></li>
        <li><a href="contact.html" data-i18n="menu_contact"></a></li>
        <li><a href="about.html" data-i18n="menu_about"></a></li>
        <li id="id-lang-options"></li>
      </ol>
    </nav>
  </header>

  <main>
    <section class="cart">
      <h2 data-i18n="my_cart"></h2>
      <table>
        <thead>
          <tr>
            <th data-i18n="th_product"></th>
            <th data-i18n="th_qty"></th>
            <th data-i18n="th_price"></th>
            <th data-i18n="th_remove"></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <img src="img/clothing1.png" alt="Roupinha Linda">
              <span data-i18n="product_1"></span>
            </td>
            <td>2</td>
            <td>30,00</td>
            <td><button class="btn-secondary"><i class="bi bi-trash"></i></button></td>
          </tr>
          <tr>
            <td>
              <img src="img/clothing2.png" alt="Roupinha Elegante">
              <span data-i18n="product_2"></span>
            </td>
            <td>1</td>
            <td>15,00</td>
            <td><button class="btn-secondary"><i class="bi bi-trash"></i></button></td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="2" data-i18n="total_label"></td>
            <td>45,00</td>
          </tr>
        </tfoot>
      </table>

      <div class="summary">
        <h3 data-i18n="summary"></h3>
        <p><span data-i18n="subtotal"></span> <span class="price">45,00</span></p>
        <p><span data-i18n="shipping"></span> <span class="price">10,00</span></p>
        <p class="total"><span data-i18n="total_label"></span> <span class="price">R$ 55,00</span></p>
        <button class="btn-primary" data-i18n="finish"></button>
      </div>
    </section>
  </main>

  <footer>
    <address data-i18n="address"></address>
  </footer>

  <script src="js/i18n.js"></script>
</body>
</html>
