<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Boo!Bazar – Cart</title>
  <link rel="stylesheet" href="../css/cart.css">
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <header>
    <nav>
      <h1>
        <a href="index.html">Boo!Bazar</a>
      </h1>

      <ol class="nav-links">
        <li><a href="cart.html">Cart</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="../pt/cart.html"><img class="flag-icon" src="../svg/br.svg" alt="BR../ Flag">PT</a></li>
      </ol>
    </nav>
  </header>

  <main>
    <section class="cart">
      <h2>My Cart</h2>
      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Price ($)</th>
            <th>Remove</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <img src="img/clothing1.png" alt="Cute Outfit">
              Cute Outfit
            </td>
            <td>2</td>
            <td>30.00</td>
            <td><button class="btn-secondary"><i class="bi bi-trash"></i></button></td>
          </tr>
          <tr>
            <td>
              <img src="img/clothing2.png" alt="Elegant Outfit">
              Elegant Outfit
            </td>
            <td>1</td>
            <td>15.00</td>
            <td><button class="btn-secondary"><i class="bi bi-trash"></i></button></td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="2">Total</td>
            <td>45.00</td>
          </tr>
        </tfoot>
      </table>

      <div class="summary">
        <h3>Summary</h3>
        <p>Subtotal <span class="price">45.00</span></p>
        <p>Shipping <span class="price">10.00</span></p>
        <p class="total">Total <span class="price">$ 55.00</span></p>
        <button class="btn-primary">Checkout</button>
      </div>
    </section>
  </main>

  <footer>
    <address>0 Dummy Street, ZIP 00000 — The Funny House</address>
  </footer>
</body>
</html>
