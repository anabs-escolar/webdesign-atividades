<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Boo!Bazar – Contact</title>
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../css/contact.css">
</head>
<body>
  <header>
    <nav>
      <h1>
        <a href="index.html">Boo!Bazar</a>
      </h1>

      <ol class="nav-links">
        <li><a href="cart.html">Cart</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="../pt/contact.html"><img class="flag-icon" src="../svg/br.svg" alt="BR Flag">PT</a></li>
      </ol>
    </nav>
  </header>

  <main>
    <section class="contact">
      <h2>Contact</h2>
      <div>
        <figure>
          <img src="../img/ghost-phone.png" alt="Ghost on the Phone">
        </figure>
        <p>
          Want to talk to us? Leave your message — we love receiving echoes from the other side!
        </p>
      </div>
      <form>
        <h3>Send a message!</h3>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Type your name...">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="example@email.com">

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Type your message here..."></textarea>

        <button class="btn-primary" type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <address>0 Dummy Street, ZIP 00000 — The Funny House where fashion passes through walls</address>
  </footer>
</body>
</html>
