<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Boo!Bazar – Carrinho</title>
  <link rel="stylesheet" href="../css/cart.css">
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <header>
    <nav>
      <h1>
        <a href="index.html">Boo!Bazar</a>
      </h1>

      <ol class="nav-links">
        <li><a href="cart.html">Carrinho</a></li>
        <li><a href="contact.html">Contato</a></li>
        <li><a href="about.html">Sobre</a></li>
        <li><a href="../en/cart.html"><img class="flag-icon" src="../svg/us.svg" alt="US Flag">../EN</a></li>
      </ol>
    </nav>
  </header>

  <main>
    <section class="cart">
      <h2>Meu Carrinho</h2>
      <table>
        <thead>
          <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço (R$)</th>
            <th>Remover</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <img src="../img/clothing1.png" alt="Roupinha Linda">
              Roupinha Linda
            </td>
            <td>2</td>
            <td>30,00</td>
            <td><button class="btn-secondary"><i class="bi bi-trash"></i></button></td>
          </tr>
          <tr>
            <td>
              <img src="../img/clothing2.png" alt="Roupinha Elegante">
              Roupinha Elegante
            </td>
            <td>1</td>
            <td>15,00</td>
            <td><button class="btn-secondary"><i class="bi bi-trash"></i></button></td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="2">Total</td>
            <td>45,00</td>
          </tr>
        </tfoot>
      </table>

      <div class="summary">
        <h3>Resumo</h3>
        <p>Subtotal <span class="price">45,00</span></p>
        <p>Frete <span class="price">10,00</span></p>
        <p class="total">Total <span class="price">R$ 55,00</span></p>
        <button class="btn-primary">Finalizar Compra</button>
      </div>
    </section>
  </main>

  <footer>
    <address>Rua dos Bobos, Nº 0, CEP 00000 — A Casa Engraçada</address>
  </footer>
</body>
</html>
