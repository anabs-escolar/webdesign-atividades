<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Boo!Bazar – Contato</title>
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../css/contact.css">
</head>
<body>
  <header>
    <nav>
      <h1>
        <a href="index.html">Boo!Bazar</a>
      </h1>

      <ol class="nav-links">
        <li><a href="cart.html">Carrinho</a></li>
        <li><a href="contact.html">Contato</a></li>
        <li><a href="about.html">Sobre</a></li>
        <li><a href="../en/contact.html"><img class="flag-icon" src="../svg/us.svg" alt="US Flag">EN</a></li>
      </ol>
    </nav>
  </header>

  <main>
    <section class="contact">
      <h2>Contato</h2>
      <div>
        <figure>
          <img src="../img/ghost-phone.png" alt="Fantasma ao Telefone">
        </figure>
        <p>
          Quer falar com a gente? Deixe sua mensagem — adoramos receber ecos do outro lado!
        </p>
      </div>
      <form>
        <h3>Envie uma mensagem!</h3>

        <label for="name">Nome Completo</label>
        <input type="text" id="name" name="name" placeholder="Digite seu nome...">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="exemplo@email.com">

        <label for="message">Mensagem</label>
        <textarea id="message" name="message" placeholder="Digite sua mensagem aqui..."></textarea>

        <button class="btn-primary" type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <footer>
    <address>Rua dos Bobos, Nº 0, CEP 00000 — A Casa Engraçada</address>
  </footer>
</body>
</html>
